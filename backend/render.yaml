# Free API service. Configure a separate Supabase project for PostgreSQL and private uploads.
services:
  - type: web
    name: quba-talents-api
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    healthCheckPath: /health/ready
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: COOKIE_SECRET
        generateValue: true
      - key: APP_ORIGIN
        sync: false
      - key: STORAGE_PROVIDER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: quba-private
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.xkiro.com/v1
      - key: AI_MODEL
        value: qwen/qwen3.8-omni-flash:free
      - key: AI_TIMEOUT_MS
        value: '60000'
      - key: AI_OUTPUT_MODE
        value: json_object
